name: lint

# Self-contained ruff lint (public repo can't call the private org reusable
# workflow: the prior caller was silently failing at startup). Uses the
# repo's ruff.toml.

# Runs on PRs and again on push to main: the push-to-main run is the backstop
# that still covers merged code, the same reason obfuscation.yml carries one.
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  lane-guard:
    name: no event-lane calls
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Mirror of hackathon-example-scripts' lane guard. This repo is the daily
      # TOURNAMENT lane; the event submit call belongs to hackathon keys and
      # scores against a disjoint id namespace. `^[^#]*` lets a `#` comment warn
      # a reader off it, while code, markdown and notebook cells are checked.
      # The symbol is echoed via $PATTERN so this step does not match itself.
      - name: No event-lane calls or instructions
        run: |
          set -uo pipefail
          PATTERN='^[^#]*(submit_event_predictions)'
          HITS="$(grep -rnE --exclude-dir=.git "$PATTERN" . || true)"
          if [ -n "$HITS" ]; then
            printf '%s\n' "$HITS"
            echo "Above: an event-lane symbol ($PATTERN) outside a code comment."
            echo 'Tournament submissions use submit_futures_predictions.'
            echo '::error::Event-lane reference outside a code comment - see the job log.'
            exit 1
          fi
          echo 'OK - no event-lane calls or instructions.'
